# Access: dev/sysadmin + gw-sucursal -> gw-vpn -> k8s-node (10.10.10.5).

# LISTEN: WAN only, UDP 1194
local 203.0.113.10
port 1194

# UDP avoids TCP-over-TCP.
proto udp4

# tun0 must match dnsmasq and nftables.
dev tun0

# TUNNEL: fixed IP per client from CCD. No dynamic pool.
topology subnet
server 10.8.0.0 255.255.255.0 nopool

# PKI: scripts/pki.sh export-server -> /etc/openvpn/server/the-store.
# Absolute paths: openvpn-server@ runs from /etc/openvpn/server.
# CA: signs both server and client certificates.
ca /etc/openvpn/server/the-store/ca.crt

# Server identity: scripts/pki.sh issue-server.
cert /etc/openvpn/server/the-store/gw-vpn.crt
key /etc/openvpn/server/the-store/gw-vpn.key

# PKI default: EC / prime256v1. TLS uses ECDH. No DH parameters file.
dh none

# TLS minimum matches client.conf.
tls-version-min 1.3

# Require a client certificate (the CA also issues server certificates).
remote-cert-tls client

data-ciphers AES-256-GCM

# tls-crypt: encrypt/authenticate control packets. Unauthenticated probes stay silent (CU1).
tls-crypt /etc/openvpn/server/the-store/tls-crypt.key

# CRL: checked on each connection. Revoked certificates rejected (CU4).
crl-verify /etc/openvpn/server/the-store/crl.pem

# CCD: file name = certificate CN. Managed by pki.sh issue-client / export-server.
#   dev .10-.19 / sysadmin .20-.29 -> route 10.10.10.5/32
#   gw-sucursal .30 -> same route + iroute 172.16.20.0/24
# Fixed IP -> role in gateway/nftables/nftables.conf. Routes grant no permissions.
client-config-dir /etc/openvpn/server/the-store/ccd

# Reject clients without CCD: no fixed IP, no nftables role.
ccd-exclusive

# BRANCH ROUTING: Linux route -> tun0. CCD iroute -> gw-sucursal.
# Destination: 172.16.20.0/24. Forward policy: replies to branch hosts only.
route 172.16.20.0 255.255.255.0

# SPLIT DNS: the-store.internal -> 10.8.0.1. Other DNS stays local.
# Windows OpenVPN 2.7+ / DCO: resolve-domains -> NRPT, without search-domains.
push "dns server 0 address 10.8.0.1"
push "dns server 0 resolve-domains the-store.internal"
# SPLIT TUNNEL: no redirect-gateway. Internet default route stays local.

# REVOCATION (CU4): CRL blocks reconnects. Management 'kill <CN>' ends active sessions.
management /run/openvpn-server/the-store.sock unix
# Socket access: root peer UID, regardless of file permissions.
management-client-user root

# KEEPALIVE: ping 10s, timeout 120s.
keepalive 10 120

# Restart/shutdown: notify clients.
explicit-exit-notify 1

# Restart: preserve keys and tun interface.
persist-key
persist-tun

# Drop root after opening keys/socket. nobody must read CRL and CCD on each connection.
user nobody
group nogroup

# STATUS: active clients + routing table, every 10s.
status /run/openvpn-server/the-store-status.log 10

verb 3
