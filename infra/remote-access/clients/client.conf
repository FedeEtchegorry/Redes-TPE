# PROFILE: pki.sh export-client appends CA, client certificate/key and tls-crypt key.
client
dev tun
proto udp
remote 203.0.113.10 1194
nobind
# SERVER IDENTITY: server certificate + CN gw-vpn.
remote-cert-tls server
verify-x509-name gw-vpn name
tls-version-min 1.3
# SPLIT TUNNEL: CCD route 10.10.10.5/32 -> VPN. Reject redirect-gateway, keep local default.
pull-filter ignore "redirect-gateway"
# Disconnect: notify server immediately.
explicit-exit-notify 1
verb 3
