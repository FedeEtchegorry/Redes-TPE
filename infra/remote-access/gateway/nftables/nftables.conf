#!/usr/sbin/nft -f
# ==============================================================================
# nftables Ruleset for The Store VPN Gateway (gw-vpn)
# Target Architecture: "The Store - Acceso Remoto Seguro" (Sección 6)
# ==============================================================================
# Purpose:
#   Implements zero-trust default-deny packet filtering and NAT on gw-vpn:
#   - Default DROP on input and forward chains.
#   - Role-based authorization: dev and sucursal can only access Ingress (TCP 80),
#     while sysadmin can also access SSH (TCP 22) and kube-apiserver (TCP 6443).
#   - Network management: SSH is accepted ONLY from the management network (eth2).
#   - DNS queries: accepted ONLY from VPN clients on tun0 to dnsmasq.
#   - SNAT: rewrites source IP of tunnel and branch traffic towards the LAN to 10.10.0.1.
#   - Dropped packets go to the kernel log ("the-store input drop: ", "the-store forward drop: ").
#
# Interfaces:
#   - eth0: Public / WAN network (203.0.113.10/24)
#   - eth1: Internal LAN (10.10.0.1/16) towards k8s-node (10.10.10.5)
#   - eth2: Management network (192.168.100.1/24)
#   - tun0: OpenVPN tunnel network (10.8.0.0/24)
#
# Match interfaces by name (iifname/oifname). nft accepts names of interfaces that do not
# exist, so gw-vpn must name its interfaces exactly.
# ==============================================================================

flush ruleset

table inet filter {
    # --------------------------------------------------------------------------
    # INPUT CHAIN: Traffic destined to the gateway itself
    # Policy: DROP (CU1: Denegación por defecto)
    # --------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        # Allow local loopback traffic
        iifname "lo" accept

        # Stateful connection tracking: accept established and related packets
        ct state established,related accept

        # Drop invalid packets immediately
        ct state invalid drop

        # 1. OpenVPN Server (from untrusted network to gw-vpn eth0 on UDP 1194)
        iifname "eth0" ip saddr 203.0.113.0/24 udp dport 1194 accept

        # 2. Split-DNS (dnsmasq on gw-vpn tun0 for VPN tunnel clients on UDP/TCP 53)
        iifname "tun0" ip saddr 10.8.0.0/24 ip daddr 10.8.0.1 meta l4proto { tcp, udp } th dport 53 accept

        # 3. SSH Administration (accepted ONLY from isolated management network on eth2)
        iifname "eth2" ip saddr 192.168.100.0/24 tcp dport 22 accept

        # Dropped by the policy. The limit keeps a flood from filling the log; broadcasts and
        # multicast are not logged.
        pkttype host limit rate 10/second burst 20 packets log prefix "the-store input drop: " level info
    }

    # --------------------------------------------------------------------------
    # FORWARD CHAIN: Traffic routed through the gateway (Tunnel / Branch -> LAN)
    # Policy: DROP (CU1: Denegación por defecto)
    # --------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Stateful connection tracking: allow responses back to clients
        ct state established,related accept

        # Drop invalid packets
        ct state invalid drop

        # 1. Role dev & sucursal -> Internal Ingress (10.10.10.5, TCP 80):
        #    - dev pool: 10.8.0.10 - 10.8.0.19
        #    - sucursal LAN: 172.16.20.0/24
        #    Access is restricted exclusively to microservices published via Ingress.
        iifname "tun0" oifname "eth1" ip saddr 10.8.0.10-10.8.0.19 ip daddr 10.10.10.5 tcp dport 80 accept
        iifname "tun0" oifname "eth1" ip saddr 172.16.20.0/24 ip daddr 10.10.10.5 tcp dport 80 accept

        # 2. Role sysadmin -> Control plane & management on k8s-node (10.10.10.5):
        #    - sysadmin pool: 10.8.0.20 - 10.8.0.29
        #    Authorized for:
        #      * Ingress (TCP 80)
        #      * Node SSH (TCP 22)
        #      * Kubernetes API Server (TCP 6443)
        iifname "tun0" oifname "eth1" ip saddr 10.8.0.20-10.8.0.29 ip daddr 10.10.10.5 tcp dport { 22, 6443, 80 } accept

        # Dropped by the policy, logged like in the input chain.
        limit rate 10/second burst 20 packets log prefix "the-store forward drop: " level info
    }
}

table ip nat {
    # --------------------------------------------------------------------------
    # POSTROUTING CHAIN: Source NAT (SNAT) towards Internal LAN
    # --------------------------------------------------------------------------
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # All forwarded traffic from the VPN tunnel (10.8.0.0/24) and branch network
        # (172.16.20.0/24) exiting via eth1 is SNAT'ed to gw-vpn's internal IP (10.10.0.1).
        # This eliminates the requirement for static return routes on k8s-node.
        oifname "eth1" ip saddr { 10.8.0.0/24, 172.16.20.0/24 } snat to 10.10.0.1
    }
}
