# ==============================================================================
# OpenVPN Server Configuration for The Store VPN Gateway (gw-vpn)
# Target Architecture: "The Store - Acceso Remoto Seguro"
# ==============================================================================
# Purpose:
#   Runs the centralized OpenVPN server on gw-vpn, providing mutual-TLS (mTLS)
#   authenticated, role-segregated remote access for dev and sysadmin clients,
#   as well as site-to-site connectivity for the branch (gw-sucursal).
#
# Network Interfaces & Topology:
#   - Public / WAN (eth0): 203.0.113.10/24 (listens on UDP 1194)
#   - Internal LAN (eth1): 10.10.0.1/16 (connected to k8s-node 10.10.10.5)
#   - Management (eth2):   192.168.100.1/24 (SSH management, CRL sync from CA)
#   - Tunnel (tun0):       10.8.0.1/24 (server IP: 10.8.0.1)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORKING & TUNNEL SETTINGS
# ------------------------------------------------------------------------------
# Listen on standard OpenVPN UDP port, only on the public address (eth0).
local 203.0.113.10
port 1194

# UDP over IPv4 is chosen for low latency, avoiding TCP-over-TCP meltdown.
proto udp4

# Interface name must be tun0 so dnsmasq and nftables can bind/filter specifically.
dev tun0

# Subnet topology: each client gets a single /32 IP address inside 10.8.0.0/24,
# with the gateway occupying 10.8.0.1.
# nopool: no dynamic addresses, every IP comes from the client's CCD file.
topology subnet
server 10.8.0.0 255.255.255.0 nopool

# ------------------------------------------------------------------------------
# 2. CRYPTOGRAPHY, AUTHENTICATION & CERTIFICATES (PKI)
# ------------------------------------------------------------------------------
# Bundle of scripts/pki.sh export-server, installed in /etc/openvpn/server/the-store.
# Absolute paths: the openvpn-server@ unit runs from /etc/openvpn/server.

# The CA certificate that signed both the server and client certificates.
ca /etc/openvpn/server/the-store/ca.crt

# Server certificate and private key (generated by scripts/pki.sh issue-server).
cert /etc/openvpn/server/the-store/gw-vpn.crt
key /etc/openvpn/server/the-store/gw-vpn.key

# Elliptic Curve cryptography is used (prime256v1); Diffie-Hellman parameters
# file is not required ('dh none') as ECDH is negotiated via TLS.
dh none

# Modern TLS configuration: enforce TLS 1.3 as minimum version (matches client.conf).
tls-version-min 1.3

# Clients must present a client certificate, not a server one.
remote-cert-tls client

cipher AES-256-GCM
data-ciphers AES-256-GCM

# tls-crypt: Pre-shared key that encrypts and authenticates all control channel packets.
# Security benefit (CU1): port scans and unauthenticated UDP packets produce NO response,
# preventing OpenVPN fingerprinting and mitigating DoS/fuzzing attacks on the TLS stack.
tls-crypt /etc/openvpn/server/the-store/tls-crypt.key

# Certificate Revocation List (CRL) verification (CU4).
# Checks crl.pem on every incoming connection attempt. Revoked certificates are rejected.
crl-verify /etc/openvpn/server/the-store/crl.pem

# ------------------------------------------------------------------------------
# 3. ROLE-BASED ACCESS CONTROL & CLIENT CONFIGURATION DIRECTORY (CCD)
# ------------------------------------------------------------------------------
# Directory containing per-client configuration files named after client Common Names.
# Managed by scripts/pki.sh issue-client / export-server:
#   - dev clients      (10.8.0.10 - 10.8.0.19): push route 10.10.10.5
#   - sysadmin clients (10.8.0.20 - 10.8.0.29): push route 10.10.10.5
#   - gw-sucursal      (10.8.0.30):             push route 10.10.10.5 + iroute 172.16.20.0
client-config-dir /etc/openvpn/server/the-store/ccd

# Reject clients without a CCD file: nftables authorizes by the fixed tunnel IP.
ccd-exclusive

# Route for branch LAN (site-to-site): instructs the host kernel to route traffic for
# the branch network (172.16.20.0/24) via tun0. OpenVPN then uses 'iroute' defined in
# the gw-sucursal CCD file to direct packets to the gw-sucursal client tunnel.
route 172.16.20.0 255.255.255.0

# ------------------------------------------------------------------------------
# 4. SPLIT-DNS & SPLIT-TUNNEL
# ------------------------------------------------------------------------------
# Only the-store.internal goes to dnsmasq (10.8.0.1): without search-domains, OpenVPN 2.7+
# on Windows (dco driver) adds an NRPT rule for it and leaves the DNS of the adapter alone.
push "dns server 0 address 10.8.0.1"
push "dns server 0 resolve-domains the-store.internal"
# Clients do not receive 'redirect-gateway', preserving their default Internet routes.

# ------------------------------------------------------------------------------
# 5. MANAGEMENT INTERFACE (SESSION TERMINATION / REVOCATION)
# ------------------------------------------------------------------------------
# Used for CU4 to kill active sessions immediately upon certificate revocation
# via the 'kill <Common-Name>' management command.
management /run/openvpn-server/the-store.sock unix
# The socket is created with mode 0777: only root may use it.
management-client-user root

# ------------------------------------------------------------------------------
# 6. OPERATIONAL & STABILITY DIRECTIVES
# ------------------------------------------------------------------------------
# Ping every 10 seconds, assume peer down if no packet received for 120 seconds.
keepalive 10 120

# Notify clients when the server is restarted or shut down.
explicit-exit-notify 1

# Maintain persistent keys and tun interface across restarts.
persist-key
persist-tun

# Drop root after initialization. Keys and the management socket are opened before.
# crl.pem and the CCD files are read on each connection, as the nobody user.
user nobody
group nogroup

# Status log file showing active connected clients and routing table entries.
status /run/openvpn-server/the-store-status.log 10

# Logging verbosity (3 is standard operational level).
verb 3
