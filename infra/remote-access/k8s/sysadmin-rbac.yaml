# Kubernetes identity of the VPN sysadmin profile: read access to the
# the-store namespace through the view ClusterRole, which excludes Secrets and exec.
# VPN certificates control network access. Kubernetes uses a separate token.
# Revoking the VPN certificate does not revoke that token.
# scripts/sysadmin-kubeconfig.sh issues its expiring tokens. To revoke all of them:
# kubectl -n the-store delete serviceaccount sysadmin.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sysadmin
  namespace: the-store
  labels:
    app.kubernetes.io/part-of: the-store
    app.kubernetes.io/component: remote-access
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sysadmin-view
  namespace: the-store
  labels:
    app.kubernetes.io/part-of: the-store
    app.kubernetes.io/component: remote-access
subjects:
  - kind: ServiceAccount
    name: sysadmin
    namespace: the-store
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
