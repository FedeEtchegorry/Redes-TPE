#!/usr/sbin/nft -f
# ==============================================================================
# nftables Ruleset for the branch gateway (gw-sucursal)
# Target Architecture: "The Store - Acceso Remoto Seguro" (CU6, Sección 6)
# ==============================================================================
# Purpose:
#   - No incoming port on the untrusted segment: gw-sucursal opens the tunnel to gw-vpn,
#     whose answers are accepted by conntrack.
#   - The branch LAN only reaches dnsmasq on gw-sucursal and, through the tunnel, the
#     Ingress (10.10.10.5, TCP 80). gw-vpn enforces the same rule on its own.
#   - No NAT: gw-vpn authorizes the branch by its source addresses (172.16.20.0/24),
#     which a masquerade to 10.8.0.30 would hide.
#   - Dropped packets go to the kernel log ("the-store input drop: ", "the-store forward drop: ").
#
# Interfaces:
#   - eth0: Untrusted segment (203.0.113.20/24)
#   - eth1: Branch LAN (172.16.20.1/24) with host-suc (172.16.20.10)
#   - tun0: OpenVPN tunnel to gw-vpn (10.8.0.30/24)
# ==============================================================================

flush ruleset

table inet filter {
    # --------------------------------------------------------------------------
    # INPUT CHAIN: Traffic destined to gw-sucursal itself
    # Policy: DROP, with no rule for eth0
    # --------------------------------------------------------------------------
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept

        # Answers of gw-vpn to the tunnel opened by gw-sucursal, and of the forwarded DNS.
        ct state established,related accept

        ct state invalid drop

        # dnsmasq for the branch LAN (UDP/TCP 53)
        iifname "eth1" ip saddr 172.16.20.0/24 ip daddr 172.16.20.1 meta l4proto { tcp, udp } th dport 53 accept

        pkttype host limit rate 10/second burst 20 packets log prefix "the-store input drop: " level info
    }

    # --------------------------------------------------------------------------
    # FORWARD CHAIN: Branch LAN -> tunnel
    # Policy: DROP
    # --------------------------------------------------------------------------
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept

        ct state invalid drop

        # Branch LAN -> Internal Ingress (10.10.10.5, TCP 80), with its own source address.
        iifname "eth1" oifname "tun0" ip saddr 172.16.20.0/24 ip daddr 10.10.10.5 tcp dport 80 accept

        limit rate 10/second burst 20 packets log prefix "the-store forward drop: " level info
    }
}
