# ==============================================================================
# dnsmasq Configuration for the branch gateway (gw-sucursal)
# Target Architecture: "The Store - Acceso Remoto Seguro" (CU6)
# ==============================================================================
# Purpose:
#   Resolver of the branch LAN (172.16.20.0/24), which has no VPN client: queries for
#   *.the-store.internal are forwarded through the tunnel to dnsmasq on gw-vpn (10.8.0.1),
#   which answers with the Ingress (10.10.10.5). Any other name is refused.
# ==============================================================================

# Only the branch LAN: never the untrusted segment (eth0), so that gw-sucursal is not an
# open resolver. bind-dynamic opens one socket per address, never the wildcard address.
interface=eth1
listen-address=172.16.20.1
except-interface=eth0
bind-dynamic

# Plain names and private reverse lookups are not forwarded.
domain-needed
bogus-priv

# No other upstream server and no local names: the branch only uses the-store.internal.
no-resolv
no-hosts

# Sent from 10.8.0.30 over tun0, which gw-vpn accepts on UDP/TCP 53.
server=/the-store.internal/10.8.0.1
