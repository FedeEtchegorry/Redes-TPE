apiVersion: v1
kind: Config
clusters:
  - name: the-store
    cluster:
      server: https://@ADDRESS@:6443
      certificate-authority-data: @CA_DATA@
users:
  - name: sysadmin
    user:
      token: @TOKEN@
contexts:
  - name: sysadmin
    context:
      cluster: the-store
      user: sysadmin
      namespace: the-store
current-context: sysadmin
