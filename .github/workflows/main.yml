name: Deploy services to local cluster

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'local.sh'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'local.sh'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  coverage:
    name: Every test is run
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # Test runner for local test execution: run-all.sh
    - name: Check that every test is run
      run: |
        for test in infra/remote-access/tests/*; do
          grep -q "$(basename "$test")" .github/workflows/*.yml ||
            { echo "::error::$test is not run by any workflow"; exit 1; }
        done

  network:
    name: ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - test: dnsmasq.sh
            packages: dnsmasq-base bind9-dnsutils
            run: bash
          - test: pki.sh
            packages: easy-rsa openvpn
            run: bash
          - test: openvpn.sh
            packages: easy-rsa openvpn socat tcpdump
            run: sudo bash
          - test: nftables.sh
            packages: nftables socat
            run: sudo bash
          - test: branch.sh
            packages: easy-rsa openvpn nftables dnsmasq-base bind9-dnsutils socat tcpdump
            run: sudo bash
          - test: provision.sh
            packages: easy-rsa openvpn openssh-server netplan.io
            run: sudo bash

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install what the test requires
      run: |
        sudo apt-get update
        sudo apt-get install --yes ${{ matrix.packages }}

    - name: Run the test
      run: ${{ matrix.run }} infra/remote-access/tests/${{ matrix.test }}

  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: On ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-docker-action@v4

    - name: Set up Kind
      uses: helm/kind-action@v1
      with:
        install_only: true

    - name: Create Kind cluster and deploy services
      run: |
        sudo ip address add 10.10.10.5/32 dev lo
        ./local.sh create-cluster --remote-access --skip-tests --skip-status

    - name: Test remote access to the cluster
      run: bash infra/remote-access/tests/kubernetes.sh

    - name: Check status
      run: |
        ./local.sh status

    - name: Run E2E tests
      run: |
        ./local.sh e2e-test

    - name: Clean up cluster
      if: always()
      run: |
        ./local.sh delete-cluster
        if kind get clusters | grep -q .; then
          echo "ERROR: Clusters still exist after cleanup"
          exit 1
        fi
