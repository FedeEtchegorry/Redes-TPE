#!/usr/sbin/nft -f

# Interfaces (names must match Netplan):
#   eth0: WAN 203.0.113.10/24
#   eth1: LAN 10.10.0.1/16
#   eth2: management 192.168.100.1/24
#   tun0: VPN 10.8.0.0/24
# Flow: VPN/branch -> tun0 -> eth1 -> k8s-node (10.10.10.5).

flush ruleset

table inet filter {
    # INPUT CHAIN: Traffic to gw-vpn
    # Policy: DROP
    chain input {
        type filter hook input priority filter; policy drop;
        iifname "lo" accept

        # Replies to existing connections.
        ct state established,related accept
        ct state invalid drop

        # WAN -> OpenVPN (UDP 1194)
        iifname "eth0" ip saddr 203.0.113.0/24 udp dport 1194 accept

        # VPN -> gateway DNS (UDP/TCP 53)
        iifname "tun0" ip saddr 10.8.0.0/24 ip daddr 10.8.0.1 meta l4proto { tcp, udp } th dport 53 accept

        # Management network -> gateway SSH (TCP 22)
        iifname "eth2" ip saddr 192.168.100.0/24 tcp dport 22 accept

        # Log drops (unicast only). Rate limit applies to logs, not DROP.
        pkttype host limit rate 10/second burst 20 packets log prefix "the-store input drop: " level info
    }

    # FORWARD CHAIN: VPN / branch -> internal LAN
    # Policy: DROP
    chain forward {
        type filter hook forward priority filter; policy drop;

        # Replies -> VPN/branch. New LAN-initiated connections stay blocked.
        ct state established,related accept
        ct state invalid drop

        # Match original source IPs, before SNAT.
        # Dev (.10-.19) / sucursal (172.16.20.0/24) -> Ingress only (TCP 80)
        iifname "tun0" oifname "eth1" ip saddr 10.8.0.10-10.8.0.19 ip daddr 10.10.10.5 tcp dport 80 accept
        iifname "tun0" oifname "eth1" ip saddr 172.16.20.0/24 ip daddr 10.10.10.5 tcp dport 80 accept

        # Sysadmin (.20-.29) -> k8s-node: HTTP 80, SSH 22, API 6443
        iifname "tun0" oifname "eth1" ip saddr 10.8.0.20-10.8.0.29 ip daddr 10.10.10.5 tcp dport { 22, 6443, 80 } accept

        # Other LAN targets/ports, VPN-to-VPN, new flows to branch: DROP + log.
        limit rate 10/second burst 20 packets log prefix "the-store forward drop: " level info
    }
}

table ip nat {
    # POSTROUTING CHAIN: VPN / branch -> internal LAN
    # Policy: ACCEPT
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;

        # SNAT -> 10.10.0.1: no VPN/branch return routes needed on k8s-node.
        # Replies: conntrack restores the destination -> tun0.
        oifname "eth1" ip saddr { 10.8.0.0/24, 172.16.20.0/24 } snat to 10.10.0.1
    }
}
