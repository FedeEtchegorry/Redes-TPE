# Installed as /etc/ssh/sshd_config.d/10-the-store.conf on gw-vpn. sshd keeps the first value
# it reads, so this file comes before others such as 50-cloud-init.conf.

# Only the management network (eth2); nftables also drops SSH on the other interfaces.
ListenAddress 192.168.100.1

# Keys only: no password to guess, and no root login.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
