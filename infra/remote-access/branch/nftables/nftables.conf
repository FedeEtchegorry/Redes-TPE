#!/usr/sbin/nft -f

# Interfaces:
#   eth0: WAN 203.0.113.20/24
#   eth1: branch LAN 172.16.20.1/24
#   tun0: VPN 10.8.0.30/24 -> gw-vpn
# Flow: host-suc (172.16.20.10) -> eth1 -> tun0 -> gw-vpn -> Ingress.
# No NAT: gw-vpn authorizes the original branch source (172.16.20.0/24).

flush ruleset

table inet filter {
    # INPUT CHAIN: Traffic to gw-sucursal
    # Policy: DROP (no incoming WAN connections)
    chain input {
        type filter hook input priority filter; policy drop;

        iifname "lo" accept

        # Replies: outbound VPN connection and forwarded DNS queries.
        ct state established,related accept

        ct state invalid drop

        # Branch LAN -> local DNS (UDP/TCP 53)
        iifname "eth1" ip saddr 172.16.20.0/24 ip daddr 172.16.20.1 meta l4proto { tcp, udp } th dport 53 accept

        # Log drops (unicast only). Rate limit applies to logs, not DROP.
        pkttype host limit rate 10/second burst 20 packets log prefix "the-store input drop: " level info
    }

    # FORWARD CHAIN: Branch LAN -> tunnel
    # Policy: DROP
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept

        ct state invalid drop

        # Branch LAN -> Ingress only (10.10.10.5:80). Source IP preserved.
        iifname "eth1" oifname "tun0" ip saddr 172.16.20.0/24 ip daddr 10.10.10.5 tcp dport 80 accept

        # Node SSH/API, other LAN targets, WAN forwarding: DROP + log.
        limit rate 10/second burst 20 packets log prefix "the-store forward drop: " level info
    }
}
