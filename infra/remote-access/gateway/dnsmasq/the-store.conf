# SPLIT DNS:
#   Configured service names -> 10.10.10.5. Unknown internal names -> NXDOMAIN.
#   Other domains -> REFUSED here. Clients keep their local resolver.

# LISTEN: VPN (tun0 / 10.8.0.1) + loopback
interface=tun0
interface=lo
listen-address=10.8.0.1
listen-address=127.0.0.1

# WAN excluded: internal names stay private. No public DNS amplification.
except-interface=eth0

# BIND: one socket per address, no wildcard. Pick up tun0 when it appears.
bind-dynamic

# No forwarding: unqualified names -> NXDOMAIN.
domain-needed

# No forwarding: private reverse lookups (PTR / RFC 1918).
bogus-priv

# SOURCES: ignore /etc/resolv.conf (no external upstream) and /etc/hosts.
no-resolv
no-hosts

# LOCAL ZONE: the-store.internal. Unknown names never go to external DNS.
local=/the-store.internal/

# HTTP FLOW: service DNS -> 10.10.10.5:80 -> NGINX Host header -> ClusterIP service.
address=/ui.the-store.internal/10.10.10.5
address=/catalog.the-store.internal/10.10.10.5
address=/carts.the-store.internal/10.10.10.5
address=/orders.the-store.internal/10.10.10.5
address=/checkout.the-store.internal/10.10.10.5
