# HTTP FLOW: configured *.the-store.internal hosts -> 10.10.10.5:80 -> ClusterIP service.
# Backend selection: HTTP Host header. Access control: gateway firewall + VM network.
apiVersion: networking.k8s.io/v1

kind: Ingress

metadata:
  name: internal-ingress
  namespace: the-store
  labels:
    app.kubernetes.io/name: internal-ingress
    app.kubernetes.io/part-of: the-store
    app.kubernetes.io/component: ingress

spec:
  ingressClassName: nginx

  rules:
    - host: ui.the-store.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ui
                port:
                  number: 80

    - host: catalog.the-store.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: catalog
                port:
                  number: 80

    - host: carts.the-store.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: carts
                port:
                  number: 80

    - host: orders.the-store.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orders
                port:
                  number: 80

    - host: checkout.the-store.internal
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: checkout
                port:
                  number: 80
