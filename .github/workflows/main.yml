name: Deploy services to local cluster

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'local.sh'
      - '.github/workflows/main.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'local.sh'
      - '.github/workflows/main.yml'
  workflow_dispatch:

jobs:
  deploy:
    strategy:
      matrix:
        os: [ubuntu-latest]
    name: On ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Docker
      uses: docker/setup-docker-action@v4

    - name: Set up Kind
      uses: helm/kind-action@v1
      with:
        install_only: true

    - name: Test dnsmasq configuration
      run: |
        sudo apt-get update
        sudo apt-get install --yes dnsmasq-base bind9-dnsutils
        bash infra/remote-access/tests/dnsmasq.sh

    - name: Create Kind cluster and deploy services
      run: |
        sudo ip address add 10.10.10.5/32 dev lo
        ./local.sh create-cluster --remote-access --skip-tests --skip-status

    - name: Test remote access to the cluster
      run: bash infra/remote-access/tests/kubernetes.sh

    - name: Check status
      run: |
        ./local.sh status

    - name: Run E2E tests
      run: |
        ./local.sh e2e-test

    - name: Clean up cluster
      if: always()
      run: |
        ./local.sh delete-cluster
        if kind get clusters | grep -q .; then
          echo "ERROR: Clusters still exist after cleanup"
          exit 1
        fi
