# DNS FLOW: host-suc -> gw-sucursal (172.16.20.1) -> VPN -> gw-vpn (10.8.0.1).
# Internal services -> Ingress 10.10.10.5. Other zones -> REFUSED.

# LISTEN: branch LAN (eth1) + automatic loopback. No WAN (eth0), no wildcard.
interface=eth1
listen-address=172.16.20.1
except-interface=eth0
bind-dynamic

# No forwarding: unqualified names / private PTR.
domain-needed
bogus-priv

# SOURCES: no /etc/resolv.conf or /etc/hosts. Only the zone below.
no-resolv
no-hosts

# VPN DNS: source 10.8.0.30 -> 10.8.0.1:53 (UDP/TCP), allowed by gw-vpn.
server=/the-store.internal/10.8.0.1
