# OpenVPN client options of the VPN profiles. scripts/pki.sh export-client appends the
# inline credentials of each client.
client
dev tun
proto udp
remote 203.0.113.10 1194
nobind
# Only the gateway certificate is accepted: issued for TLS servers and named gw-vpn.
remote-cert-tls server
verify-x509-name gw-vpn name
tls-version-min 1.3
# Split tunnel: the default route stays on the local network even if the server pushes
# redirect-gateway; only the route in the client CCD goes through the tunnel.
pull-filter ignore "redirect-gateway"
# Tells the server when the client disconnects, so that it frees the session at once.
explicit-exit-notify 1
verb 3
